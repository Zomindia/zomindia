name: Build Zomindia Partner APK and AAB

on:
  workflow_dispatch:

jobs:
  build-partner:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Pure Android APK and AAB
        run: |
          mkdir -p partner-android/app/src/main/res/drawable
          cd partner-android

          # 1. Partner App Icon
          if [ -f "$GITHUB_WORKSPACE/public/partner-icon-512.png" ]; then
            cp "$GITHUB_WORKSPACE/public/partner-icon-512.png" app/src/main/res/drawable/ic_launcher.png
          elif [ -f "$GITHUB_WORKSPACE/public/pwa-512x512.png" ]; then
            cp "$GITHUB_WORKSPACE/public/pwa-512x512.png" app/src/main/res/drawable/ic_launcher.png
          else
            echo "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNkWPjfDwAEeQHzfXkLqAAAAABJRU5ErkJggg==" | base64 -d > app/src/main/res/drawable/ic_launcher.png
          fi

          # 2. Release Keystore Setup
          if [ -f "$GITHUB_WORKSPACE/android/keystores/partner-release.keystore" ]; then
            echo "Using committed partner release keystore..."
            cp "$GITHUB_WORKSPACE/android/keystores/partner-release.keystore" partner-release.keystore
          elif [ -n "$KEYSTORE_BASE64" ]; then
            echo "Decoding release keystore from secrets.KEYSTORE_BASE64..."
            echo "$KEYSTORE_BASE64" | base64 -d > partner-release.keystore
          else
            echo "Generating fallback partner keystore..."
            keytool -genkey -v -keystore partner-release.keystore \
              -alias partner \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass zomindia123 \
              -keypass zomindia123 \
              -dname "CN=Zomindia Partner, OU=Operations, O=Zomindia Internet Technology, L=Indore, ST=Madhya Pradesh, C=IN"
          fi

          echo "=== PARTNER APK SHA-256 FINGERPRINT ==="
          keytool -list -v -keystore partner-release.keystore -alias partner -storepass zomindia123 | grep "SHA256:" || true
          echo "========================================"

          # 3. Create gradle.properties (Fixes AndroidX requirement & SDK 36 support)
          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          android.enableJetifier=true
          android.suppressUnsupportedCompileSdk=36
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          # 4. Create settings.gradle
          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "ZomindiaPartner"
          include ':app'
          EOF

          # 5. Create Root build.gradle
          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.4.2' apply false
          }
          EOF

          # 6. Create app/build.gradle
          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.zomindia.partner'
              compileSdk 36

              defaultConfig {
                  applicationId "com.zomindia.partner"
                  minSdk 24
                  targetSdk 36
                  versionCode 1
                  versionName "1.0.0"
              }

              signingConfigs {
                  release {
                      storeFile file("../partner-release.keystore")
                      storePassword "zomindia123"
                      keyAlias "partner"
                      keyPassword "zomindia123"
                  }
              }

              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
          }
          EOF

          # 7. Create AndroidManifest.xml (Loads https://zomindia.com/partner)
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />

              <application
                  android:allowBackup="true"
                  android:icon="@drawable/ic_launcher"
                  android:label="Zomindia Partner"
                  android:theme="@android:style/Theme.Translucent.NoTitleBar">

                  <activity
                      android:name="com.google.androidbrowserhelper.trusted.LauncherActivity"
                      android:exported="true">
                      <meta-data
                          android:name="android.support.customtabs.trusted.DEFAULT_URL"
                          android:value="https://zomindia.com/partner" />
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                      <intent-filter android:autoVerify="true">
                          <action android:name="android.intent.action.VIEW" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.BROWSABLE" />
                          <data
                              android:scheme="https"
                              android:host="zomindia.com"
                              android:pathPrefix="/partner" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # Accept Android licenses & ensure Android SDK 36 platform is available
          if [ -n "$ANDROID_HOME" ] && [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" || true
          fi

          # 8. Gradle Wrapper & Assemble Release + Bundle Release
          gradle wrapper --gradle-version 8.5
          chmod +x ./gradlew
          ./gradlew assembleRelease bundleRelease --no-daemon

          # Copy ready-to-use signed APK and AAB
          cp app/build/outputs/apk/release/*.apk app-release-signed.apk
          cp app/build/outputs/bundle/release/*.aab app-release-signed.aab
          echo "APK AND AAB BUILD SUCCESSFUL"

      - name: Upload Partner APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: zomindia-partner-apk
          path: partner-android/app-release-signed.apk

      - name: Upload Partner AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: zomindia-partner-aab
          path: partner-android/app-release-signed.aab
