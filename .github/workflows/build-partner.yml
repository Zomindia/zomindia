name: Build Zomindia Partner APK

on:
  workflow_dispatch:

jobs:
  build-partner:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Configure Bubblewrap Environment
        run: |
          mkdir -p ~/.bubblewrap
          cat << EOF > ~/.bubblewrap/config.json
          {
            "jdkPath": "$JAVA_HOME",
            "androidSdkPath": "$ANDROID_HOME"
          }
          EOF

      - name: Prepare Partner Project & Keystore
        run: |
          mkdir -p partner-android
          cd partner-android

          # Generate dedicated keystore for Partner APK
          keytool -genkey -v -keystore partner-release.keystore \
            -alias partner \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass zomindia123 \
            -keypass zomindia123 \
            -dname "CN=Zomindia Partner, OU=Operations, O=Zomindia Internet Technology, L=Indore, ST=Madhya Pradesh, C=IN"

          # Print SHA-256 fingerprint for AssetLinks
          echo "=== PARTNER APK SHA-256 FINGERPRINT ==="
          keytool -list -v -keystore partner-release.keystore -alias partner -storepass zomindia123 | grep "SHA256:"
          echo "========================================"

          # Prefer high-res partner icon if available in public, fallback to pwa icon or generate valid PNG
          if [ -s "../public/partner-icon-512.png" ]; then
            cp ../public/partner-icon-512.png icon-512.png
          elif [ -s "../public/pwa-512x512.png" ]; then
            cp ../public/pwa-512x512.png icon-512.png
          elif [ -s "../public/icon-512.png" ]; then
            cp ../public/icon-512.png icon-512.png
          else
            python3 -c "
          import zlib, struct
          raw = b''.join(b'\x00' + bytes([30, 64, 175, 255] * 512) for _ in range(512))
          compressed = zlib.compress(raw)
          def chunk(t, d):
              return struct.pack('>I', len(d)) + t + d + struct.pack('>I', zlib.crc32(t + d) & 0xffffffff)
          png = b'\x89PNG\r\n\x1a\n' + chunk(b'IHDR', struct.pack('>IIBBBBB', 512, 512, 8, 6, 0, 0, 0)) + chunk(b'IDAT', compressed) + chunk(b'IEND', b'')
          with open('icon-512.png', 'wb') as f:
              f.write(png)
          "
          fi

          # Host icon locally for Bubblewrap fetch
          python3 -m http.server 8085 &
          SERVER_PID=$!
          sleep 2

          # Create TWA manifest pointing directly to /partner with explicit enableNotifications: false and splashScreenFadeOutDuration: 300
          cat << 'EOF' > twa-manifest.json
          {
            "packageId": "com.zomindia.partner",
            "host": "zomindia.com",
            "name": "Zomindia Partner",
            "launcherName": "Partner",
            "themeColor": "#1E40AF",
            "navigationColor": "#000000",
            "backgroundColor": "#FFFFFF",
            "startUrl": "/partner",
            "iconUrl": "http://localhost:8085/icon-512.png",
            "maskableIconUrl": "http://localhost:8085/icon-512.png",
            "appVersionName": "1.0.0",
            "appVersionCode": 1,
            "shortcuts": [],
            "generatorApp": "bubblewrap-cli",
            "webManifestUrl": "https://zomindia.com/manifest.json",
            "fallbackType": "customtabs",
            "features": {
              "locationDelegation": {
                "enabled": true
              }
            },
            "splashScreenFadeOutDuration": 300,
            "enableNotifications": false,
            "alphaDependencies": {
              "enabled": false
            },
            "enableSiteSettingsShortcut": true,
            "isChromeOSOnly": false,
            "isMetaQuest": false,
            "signingKey": {
              "path": "./partner-release.keystore",
              "alias": "partner"
            }
          }
          EOF

          # Set environment passwords for unattended CI build
          export BUBBLEWRAP_KEYSTORE_PASSWORD=zomindia123
          export BUBBLEWRAP_KEY_PASSWORD=zomindia123

          # Generate the Gradle project files from twa-manifest.json
          bubblewrap update --skipVersionUpgrade

          # Clean up local icon server
          kill $SERVER_PID || true

          # Universal regex cleaner: delete ANY dangling unassigned property generated by Bubblewrap
          if [ -f "app/build.gradle" ]; then
            sed -i '/:[[:space:]]*,/d' app/build.gradle
            sed -i '/:[[:space:]]*$/d' app/build.gradle
          fi

          # Build release APK via Gradle wrapper
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon

          # Find unsigned/release APK and sign with apksigner or jarsigner
          RELEASE_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$RELEASE_APK" ]; then
            RELEASE_APK=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          fi

          echo "Found release apk at: $RELEASE_APK"
          cp "$RELEASE_APK" app-release-signed.apk

          # Locate apksigner in Android SDK build-tools
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
          if [ -n "$APKSIGNER" ] && [ -x "$APKSIGNER" ]; then
            echo "Signing with apksigner: $APKSIGNER"
            "$APKSIGNER" sign --ks partner-release.keystore \
              --ks-key-alias partner \
              --ks-pass pass:zomindia123 \
              --key-pass pass:zomindia123 \
              --out app-release-signed.apk \
              "$RELEASE_APK"
            "$APKSIGNER" verify app-release-signed.apk
          else
            echo "apksigner not found; falling back to jarsigner..."
            jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
              -keystore partner-release.keystore \
              -storepass zomindia123 \
              -keypass zomindia123 \
              app-release-signed.apk \
              partner
            jarsigner -verify app-release-signed.apk
          fi

          echo "Partner APK successfully built and signed: app-release-signed.apk"

      - name: Upload Partner APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: zomindia-partner-apk
          path: partner-android/app-release-signed.apk
