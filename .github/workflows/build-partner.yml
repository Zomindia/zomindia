name: Build Zomindia Partner APK

on:
  workflow_dispatch:

jobs:
  build-partner:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Pure Android APK (Zero Bubblewrap)
        run: |
          # 1. Android Directory Structure
          mkdir -p partner-android/app/src/main/res/drawable
          cd partner-android

          # 2. Setup Partner Icon
          if [ -f "$GITHUB_WORKSPACE/public/partner-icon-512.png" ]; then
            cp "$GITHUB_WORKSPACE/public/partner-icon-512.png" app/src/main/res/drawable/ic_launcher.png
          elif [ -f "$GITHUB_WORKSPACE/public/pwa-512x512.png" ]; then
            cp "$GITHUB_WORKSPACE/public/pwa-512x512.png" app/src/main/res/drawable/ic_launcher.png
          else
            echo "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNkWPjfDwAEeQHzfXkLqAAAAABJRU5ErkJggg==" | base64 -d > app/src/main/res/drawable/ic_launcher.png
          fi

          # 3. Create Production Keystore
          keytool -genkey -v -keystore partner-release.keystore \
            -alias partner \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass zomindia123 \
            -keypass zomindia123 \
            -dname "CN=Zomindia Partner, OU=Operations, O=Zomindia Internet Technology, L=Indore, ST=Madhya Pradesh, C=IN"

          echo "=== PARTNER APK SHA-256 FINGERPRINT ==="
          keytool -list -v -keystore partner-release.keystore -alias partner -storepass zomindia123 | grep "SHA256:"
          echo "========================================"

          # 4. Create settings.gradle
          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "ZomindiaPartner"
          include ':app'
          EOF

          # 5. Create Root build.gradle
          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
          }
          EOF

          # 6. Create app/build.gradle (Pure Android Standard)
          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.zomindia.partner'
              compileSdk 34

              defaultConfig {
                  applicationId "com.zomindia.partner"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0.0"
              }

              signingConfigs {
                  release {
                      storeFile file("../partner-release.keystore")
                      storePassword "zomindia123"
                      keyAlias "partner"
                      keyPassword "zomindia123"
                  }
              }

              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
              implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
          }
          EOF

          # 7. Create AndroidManifest.xml (TWA Launching directly to /partner)
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />

              <application
                  android:allowBackup="true"
                  android:icon="@drawable/ic_launcher"
                  android:label="Zomindia Partner"
                  android:theme="@android:style/Theme.Translucent.NoTitleBar">

                  <activity
                      android:name="com.google.androidbrowserhelper.trusted.LauncherActivity"
                      android:exported="true">
                      <meta-data
                          android:name="android.support.customtabs.trusted.DEFAULT_URL"
                          android:value="https://zomindia.com/partner" />
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                      <intent-filter android:autoVerify="true">
                          <action android:name="android.intent.action.VIEW" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.BROWSABLE" />
                          <data
                              android:scheme="https"
                              android:host="zomindia.com"
                              android:pathPrefix="/partner" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # 8. Initialize clean Gradle Wrapper and Assemble Release APK
          gradle wrapper --gradle-version 8.5
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon

          # Copy signed APK for artifact upload
          cp app/build/outputs/apk/release/app-release.apk app-release-signed.apk
          echo "BUILD SUCCESSFUL! Pure Signed APK Generated."

      - name: Upload Partner APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: zomindia-partner-apk
          path: partner-android/app-release-signed.apk
