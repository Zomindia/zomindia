name: Build Zomindia Partner APK

on:
  workflow_dispatch:

jobs:
  build-partner:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Configure Bubblewrap Environment
        run: |
          mkdir -p ~/.bubblewrap
          cat << EOF > ~/.bubblewrap/config.json
          {
            "jdkPath": "$JAVA_HOME",
            "androidSdkPath": "$ANDROID_HOME"
          }
          EOF

      - name: Build Partner APK
        run: |
          # 1. Start a local server to serve public icons
          python3 -m http.server 8085 --directory public &
          SERVER_PID=$!
          sleep 2

          mkdir -p partner-android
          cd partner-android

          # 2. Generate Keystore
          keytool -genkey -v -keystore partner-release.keystore \
            -alias partner \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass zomindia123 \
            -keypass zomindia123 \
            -dname "CN=Zomindia Partner, OU=Operations, O=Zomindia Internet Technology, L=Indore, ST=Madhya Pradesh, C=IN"

          echo "=== PARTNER APK SHA-256 ==="
          keytool -list -v -keystore partner-release.keystore -alias partner -storepass zomindia123 | grep "SHA256:"
          echo "==========================="

          # 3. Create TWA Manifest with your real icon
          cat << 'EOF' > twa-manifest.json
          {
            "packageId": "com.zomindia.partner",
            "host": "zomindia.com",
            "name": "Zomindia Partner",
            "launcherName": "Partner",
            "themeColor": "#1E40AF",
            "navigationColor": "#000000",
            "backgroundColor": "#FFFFFF",
            "startUrl": "/partner",
            "iconUrl": "http://localhost:8085/partner-icon-512.png",
            "maskableIconUrl": "http://localhost:8085/partner-icon-512.png",
            "appVersionName": "1.0.0",
            "appVersionCode": 1,
            "shortcuts": [],
            "generatorApp": "bubblewrap-cli",
            "webManifestUrl": "https://zomindia.com/manifest.json",
            "fallbackType": "customtabs",
            "features": {
              "locationDelegation": {
                "enabled": true
              }
            },
            "alphaDependencies": {
              "enabled": false
            },
            "enableSiteSettingsShortcut": true,
            "isChromeOSOnly": false,
            "isMetaQuest": false,
            "signingKey": {
              "path": "./partner-release.keystore",
              "alias": "partner"
            }
          }
          EOF

          export BUBBLEWRAP_KEYSTORE_PASSWORD=zomindia123
          export BUBBLEWRAP_KEY_PASSWORD=zomindia123

          # 4. Generate Android files and Build APK
          bubblewrap update --skipVersionUpgrade
          kill $SERVER_PID || true
          bubblewrap build --skipPwaValidation

      - name: Upload Partner APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: zomindia-partner-apk
          path: partner-android/app-release-signed.apk
