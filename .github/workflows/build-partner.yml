name: Build Zomindia Partner APK

on:
  workflow_dispatch:

jobs:
  build-partner:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Pre-configure Bubblewrap Environment
        run: |
          mkdir -p ~/.bubblewrap
          cat << EOF > ~/.bubblewrap/config.json
          {
            "jdkPath": "$JAVA_HOME",
            "androidSdkPath": "$ANDROID_HOME"
          }
          EOF

      - name: Build Partner APK
        run: |
          # 1. Fallback icon generation in public folder
          mkdir -p public
          if [ ! -f "public/partner-icon-512.png" ]; then
            python3 -c "
          import zlib, struct
          raw = b''.join(b'\x00' + bytes([30, 64, 175, 255] * 512) for _ in range(512))
          compressed = zlib.compress(raw)
          def chunk(t, d):
              return struct.pack('>I', len(d)) + t + d + struct.pack('>I', zlib.crc32(t + d) & 0xffffffff)
          png = b'\x89PNG\r\n\x1a\n' + chunk(b'IHDR', struct.pack('>IIBBBBB', 512, 512, 8, 6, 0, 0, 0)) + chunk(b'IDAT', compressed) + chunk(b'IEND', b'')
          with open('public/partner-icon-512.png', 'wb') as f:
              f.write(png)
          "
          fi

          # 2. Start HTTP server for icon
          python3 -m http.server 8085 --bind 127.0.0.1 --directory public &
          SERVER_PID=$!
          sleep 2

          mkdir -p partner-android
          cd partner-android

          # 3. Keystore creation
          keytool -genkey -v -keystore partner-release.keystore \
            -alias partner \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass zomindia123 \
            -keypass zomindia123 \
            -dname "CN=Zomindia Partner, OU=Operations, O=Zomindia Internet Technology, L=Indore, ST=Madhya Pradesh, C=IN"

          # 4. TWA Manifest with notifications explicit true
          cat << 'EOF' > twa-manifest.json
          {
            "packageId": "com.zomindia.partner",
            "host": "zomindia.com",
            "name": "Zomindia Partner",
            "launcherName": "Partner",
            "themeColor": "#1E40AF",
            "navigationColor": "#000000",
            "backgroundColor": "#FFFFFF",
            "startUrl": "/partner",
            "iconUrl": "http://127.0.0.1:8085/partner-icon-512.png",
            "maskableIconUrl": "http://127.0.0.1:8085/partner-icon-512.png",
            "appVersionName": "1.0.0",
            "appVersionCode": 1,
            "shortcuts": [],
            "generatorApp": "bubblewrap-cli",
            "webManifestUrl": "https://zomindia.com/manifest.json",
            "fallbackType": "customtabs",
            "features": {
              "locationDelegation": {
                "enabled": true
              }
            },
            "alphaDependencies": {
              "enabled": false
            },
            "enableNotifications": false,
            "enableSiteSettingsShortcut": true,
            "isChromeOSOnly": false,
            "isMetaQuest": false,
            "signingKey": {
              "path": "./partner-release.keystore",
              "alias": "partner"
            }
          }
          EOF

          export BUBBLEWRAP_KEYSTORE_PASSWORD=zomindia123
          export BUBBLEWRAP_KEY_PASSWORD=zomindia123

          # 5. Generate project and kill icon server
          bubblewrap update --skipVersionUpgrade
          kill $SERVER_PID || true

          # 6. Patch build.gradle if any blank notifications template exists
          if [ -f "app/build.gradle" ]; then
            sed -i 's/enableNotifications:[[:space:]]*,/enableNotifications: false,/g' app/build.gradle
            sed -i 's/enableNotifications:[[:space:]]*$/enableNotifications: false/g' app/build.gradle
          fi

          # 7. Official Gradle build
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon

          # 8. Sign APK
          BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
          UNSIGNED_APK=$(find app/build/outputs/apk/release/ -name "*.apk" | head -n 1)

          $BUILD_TOOLS/zipalign -v -p 4 "$UNSIGNED_APK" app-aligned.apk || cp "$UNSIGNED_APK" app-aligned.apk
          $BUILD_TOOLS/apksigner sign --ks partner-release.keystore --ks-pass pass:zomindia123 --ks-key-alias partner --key-pass pass:zomindia123 --out app-release-signed.apk app-aligned.apk

      - name: Upload Partner APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: zomindia-partner-apk
          path: partner-android/app-release-signed.apk
