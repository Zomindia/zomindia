name: Build Android Release (AAB & APK)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Web Dependencies
        run: npm ci || npm install

      - name: Build Web App & Sync Capacitor
        run: |
          npm run build
          npx cap sync android

      - name: Grant Execute Permission to Gradlew
        run: chmod +x android/gradlew

      - name: Inject New App Icons into Android Mipmap
        run: |
          ICON_SRC="public/pwa-512x512.png"
          if [ ! -f "$ICON_SRC" ]; then ICON_SRC="public/icon-512.png"; fi
          if [ -f "$ICON_SRC" ]; then
            echo "Injecting $ICON_SRC into Android mipmap directories..."
            for dir in android/app/src/main/res/mipmap-*; do
              if [ -d "$dir" ] && [ "$dir" != "android/app/src/main/res/mipmap-anydpi-v26" ]; then
                cp "$ICON_SRC" "$dir/ic_launcher.png"
                cp "$ICON_SRC" "$dir/ic_launcher_round.png"
                cp "$ICON_SRC" "$dir/ic_launcher_foreground.png"
              fi
            done
            if [ -f "android/app/src/main/res/drawable/ic_launcher_foreground.png" ]; then
              cp "$ICON_SRC" "android/app/src/main/res/drawable/ic_launcher_foreground.png"
            fi
          fi

      - name: Build Release AAB & APK (v9.0 / code 9)
        run: |
          sed -i 's/versionCode [0-9]\+/versionCode 9/' android/app/build.gradle
          sed -i 's/versionName ".*"/versionName "9.0"/' android/app/build.gradle
          cd android
          ./gradlew bundleRelease assembleRelease assembleDebug --stacktrace

      - name: Sign Release Artifacts with Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Decoding release keystore from secrets.KEYSTORE_BASE64..."
            echo "$KEYSTORE_BASE64" | base64 -d > android/release.keystore

            ALIAS="${KEY_ALIAS:-${{ secrets.ALIAS }}}"
            STORE_PASS="${KEYSTORE_PASSWORD:-${{ secrets.KEY_STORE_PASSWORD }}}"
            KEY_PASS="${KEY_PASSWORD:-$STORE_PASS}"

            AAB_FILE=$(find android/app/build/outputs/bundle/release -name "*.aab" | head -n 1)
            if [ -n "$AAB_FILE" ]; then
              echo "Signing $AAB_FILE..."
              jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
                -keystore android/release.keystore \
                -storepass "$STORE_PASS" \
                -keypass "$KEY_PASS" \
                "$AAB_FILE" \
                "$ALIAS"
              echo "Verifying AAB signature..."
              jarsigner -verify "$AAB_FILE"
            else
              echo "Warning: No AAB file found to sign."
            fi

            APK_FILE=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
            if [ -z "$APK_FILE" ]; then
              APK_FILE=$(find android/app/build/outputs/apk -name "*.apk" | head -n 1)
            fi
            if [ -n "$APK_FILE" ]; then
              echo "Signing $APK_FILE..."
              jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
                -keystore android/release.keystore \
                -storepass "$STORE_PASS" \
                -keypass "$KEY_PASS" \
                "$APK_FILE" \
                "$ALIAS"
              echo "Verifying APK signature..."
              jarsigner -verify "$APK_FILE"
              echo "Printing APK certificate fingerprints:"
              keytool -printcert -jarfile "$APK_FILE"
            else
              echo "Warning: No APK file found to sign."
            fi

            rm -f android/release.keystore
            echo "Artifacts successfully signed."
          else
            echo "Warning: secrets.KEYSTORE_BASE64 is not set. Artifacts remain unsigned."
          fi

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: zomindia-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          retention-days: 14

      - name: Upload Tester APK
        uses: actions/upload-artifact@v4
        with:
          name: zomindia-tester-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
