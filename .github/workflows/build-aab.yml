name: Build Android App Bundle (AAB)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Web Dependencies
        run: npm ci || npm install

      - name: Build Web App & Sync Capacitor
        run: |
          npm run build
          npx cap sync android

      - name: Grant Execute Permission to Gradlew
        run: chmod +x android/gradlew

      - name: Build Release AAB
        run: |
          cd android
          ./gradlew bundleRelease --stacktrace

      - name: Sign Release AAB with Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Decoding release keystore from secrets.KEYSTORE_BASE64..."
            echo "$KEYSTORE_BASE64" | base64 -d > android/release.keystore

            AAB_FILE=$(find android/app/build/outputs/bundle/release -name "*.aab" | head -n 1)
            if [ -z "$AAB_FILE" ]; then
              echo "Error: No AAB file found in android/app/build/outputs/bundle/release"
              exit 1
            fi

            echo "Signing $AAB_FILE..."
            ALIAS="${KEY_ALIAS:-${{ secrets.ALIAS }}}"
            STORE_PASS="${KEYSTORE_PASSWORD:-${{ secrets.KEY_STORE_PASSWORD }}}"
            KEY_PASS="${KEY_PASSWORD:-$STORE_PASS}"

            jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
              -keystore android/release.keystore \
              -storepass "$STORE_PASS" \
              -keypass "$KEY_PASS" \
              "$AAB_FILE" \
              "$ALIAS"

            echo "Verifying AAB signature..."
            jarsigner -verify "$AAB_FILE"

            rm -f android/release.keystore
            echo "Release AAB successfully signed."
          else
            echo "Warning: secrets.KEYSTORE_BASE64 is not set. AAB remains unsigned."
          fi

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: zomindia-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          retention-days: 7
